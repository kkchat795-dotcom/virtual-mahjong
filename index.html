<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#160b08"><title>Mahjong Emas — Virtual</title>
<style>
:root{--gold:#ffe6a0;--gold2:#d49a35;--red:#761b18;--ink:#190c0a;--jade:#1e6650}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff2d2;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 20%,#793b20 0,#3a1712 42%,#100807 100%);padding:12px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#f6cf77 1px,transparent 1px);background-size:19px 19px}
.app{max-width:520px;margin:auto;position:relative}.top{text-align:center;padding:7px 0 13px}.brand{font-size:clamp(30px,8vw,43px);font-weight:1000;letter-spacing:2px;color:#ffe7a0;text-shadow:0 2px 0 #8d3e12,0 4px 0 #4b1d0b,0 0 22px #ffb72c;line-height:1.1}.subtitle{font:700 9px Arial;letter-spacing:4px;color:#e9bd75;margin-top:6px}
.topstats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border:1px solid #c28c42;border-radius:12px;padding:9px 12px;background:linear-gradient(145deg,#4a2019,#21100e);box-shadow:inset 0 0 14px #ffdc7920,0 4px 10px #0008}.stat small{display:block;font:700 9px Arial;letter-spacing:1.5px;color:#d9b77b}.stat strong{display:block;font:bold 22px Arial;color:#ffe39a;margin-top:3px;text-shadow:0 2px #57250d;font-variant-numeric:tabular-nums}
.gameframe{margin-top:12px;padding:8px;border-radius:19px;background:linear-gradient(135deg,#fff0a6,#9a541b 17%,#f6cf69 32%,#6b3216 50%,#e6b74e 75%,#6c3518);box-shadow:0 8px 0 #34150c,0 14px 28px #0009,inset 0 0 0 2px #ffe8a0}
.frameinner{border-radius:13px;padding:9px;background:linear-gradient(145deg,#31130f,#160b09 60%,#35130e);border:2px solid #7d421b}
.framehead{display:flex;justify-content:space-between;align-items:center;padding:0 3px 8px;font:700 9px Arial;letter-spacing:1.5px;color:#e9c77f}.pill{border:1px solid #a97735;border-radius:20px;padding:4px 8px;color:#ffe4a1;background:#451b13}
.reels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:7px;border:1px solid #9e6b32;border-radius:9px;background:linear-gradient(#0b0807,#24100b);box-shadow:inset 0 0 20px #000}
.reel{display:grid;grid-template-rows:repeat(4,1fr);gap:5px;min-width:0}
.tile{aspect-ratio:.88;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:7px;border:1px solid #fff0c0;background:linear-gradient(145deg,#fff8d9 0%,#f4d58b 38%,#c68b3c 100%);box-shadow:inset 0 2px 3px #fff,inset 0 -4px 0 #8d511f,0 2px 3px #000b;color:#5d1b14;font-family:Arial;font-size:clamp(25px,7vw,38px);font-weight:900;text-shadow:0 1px #fff7;transition:transform .2s,filter .2s}
.tile:after{content:"";position:absolute;inset:3px;border:1px solid #a66a2c;border-radius:4px;pointer-events:none}.tile.win{z-index:2;filter:brightness(1.4);animation:winpop .5s infinite alternate;box-shadow:0 0 14px #ffe96b,inset 0 0 13px #fff}.tile.empty{opacity:0;transform:scale(.6)}
@keyframes winpop{to{transform:scale(1.06);filter:brightness(1.7)}}
.symbol{position:relative;z-index:1;line-height:1}.sym-red{color:#a51d20}.sym-green{color:#14724c}.sym-blue{color:#1b4b8d}.sym-gold{color:#a66b13}
.winbar{height:35px;display:grid;place-items:center;text-align:center;color:#ffe69b;font:bold 13px Arial;text-shadow:0 0 10px #ffb62b;padding:4px}
.controls{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.control{border:1px solid #a36e32;border-radius:10px;background:linear-gradient(145deg,#472019,#210f0d);padding:8px;text-align:center}.control label{display:block;font:700 9px Arial;letter-spacing:1.2px;color:#d8b77a;margin-bottom:7px}.stepper{display:flex;justify-content:center;align-items:center;gap:13px;font:bold 17px Arial;color:#ffe7a5}.stepper button{width:28px;height:27px;padding:0;font-size:18px}
button{border:1px solid #ffe6a0;border-radius:8px;background:linear-gradient(#fff0b8,#d99a37);color:#421b0b;font-weight:900;box-shadow:0 3px 0 #7c431a;cursor:pointer}button:active{transform:translateY(2px);box-shadow:0 1px 0 #7c431a}button:disabled{opacity:.45}
.betvalue{min-width:48px}.actions{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:7px;margin-top:10px}.spin{font:900 19px Arial;letter-spacing:1px;padding:15px 4px;background:linear-gradient(#fff2ba,#e4a32f);box-shadow:0 4px 0 #89501b,0 0 17px #f4bb4d55}.utility{font:900 11px Arial;padding:8px 3px;background:linear-gradient(#f4d99b,#b67a32)}.utility.active{background:linear-gradient(#ffb59c,#9e3326);color:white}
.multiplier{display:flex;justify-content:center;gap:6px;margin-top:9px}.multi{font:900 11px Arial;padding:7px 11px;background:linear-gradient(#6b3823,#35160f);color:#ffe2a0;border:1px solid #ad7839;box-shadow:none}.multi.active{background:linear-gradient(#fff0ad,#d69a37);color:#451d0c}
.disclaimer{text-align:center;font:10px/1.5 Arial;color:#c8a982;margin:13px 8px 6px}
.admin{display:none;margin-top:12px;padding:12px;background:#24100d;border:1px solid #b98a43;border-radius:12px;font:12px Arial}.admin.show{display:block}.admin input{width:100%;padding:10px;margin:5px 0;background:#120908;border:1px solid #9c7039;color:#fff;border-radius:7px}.toast{font:11px Arial;color:#ffe6a0;text-align:center;min-height:17px;margin-top:7px}
@media(max-width:360px){body{padding:7px}.frameinner{padding:6px}.reels{gap:3px;padding:5px}.reel{gap:3px}.tile{font-size:24px}.actions{gap:5px}.spin{font-size:16px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand" id="brand">MAHJONG EMAS</div><div class="subtitle">FORTUNE • CASCADE • VIRTUAL PLAY</div></header>
<div class="topstats"><div class="stat"><small>SALDO KOIN</small><strong id="balance">10.000</strong></div><div class="stat"><small>MENANG TERAKHIR</small><strong id="lastWin">0</strong></div></div>
<section class="gameframe"><div class="frameinner">
<div class="framehead"><span>✦ REELS KEBERUNTUNGAN ✦</span><span class="pill" id="cascade">CASCADE x1</span></div>
<div class="reels" id="reels" aria-label="Lima gulungan empat baris"></div>
<div class="winbar" id="message">TEKAN PUTAR UNTUK MULAI</div>
</div></section>
<div class="controls">
<div class="control"><label>NILAI TARUHAN</label><div class="stepper"><button id="minus">−</button><span class="betvalue" id="bet">100</span><button id="plus">+</button></div></div>
<div class="control"><label>TARUHAN PER PUTARAN</label><div class="stepper"><span id="totalBet">100</span><span style="font-size:10px;color:#c9a878">KOIN</span></div></div>
</div>
<div class="multiplier" id="multipliers"><button class="multi active" data-m="1">x1</button><button class="multi" data-m="2">x2</button><button class="multi" data-m="3">x3</button><button class="multi" data-m="5">x5</button></div>
<div class="actions"><button class="spin" id="spin">▶ PUTAR</button><button class="utility" id="turbo">⚡ TURBO</button><button class="utility" id="auto">AUTO 10</button></div>
<div class="toast" id="toast"></div>
<p class="disclaimer">Permainan hiburan dengan koin virtual saja. Tidak ada deposit, taruhan uang asli, atau penarikan.</p>
</section>
<section class="admin" id="admin"><b>⚙ PANEL ADMIN DEMO</b><input id="pin" type="password" inputmode="numeric" placeholder="PIN admin"><button id="unlock">BUKA</button><div id="adminControls" style="display:none"><input id="newBalance" type="number" min="0" value="10000"><button id="save">SIMPAN SALDO</button><button id="reset">RESET</button></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);
const icons=[['🀇','sym-red'],['🀈','sym-red'],['🀉','sym-red'],['🀙','sym-green'],['🀚','sym-green'],['🀛','sym-green'],['🀐','sym-blue'],['🀑','sym-blue'],['🀒','sym-blue'],['🀄','sym-red'],['🀅','sym-green'],['🀆','sym-gold'],['🀀','sym-gold'],['🀁','sym-gold']];
let balance=Math.max(0,Number(localStorage.getItem('me_balance')||10000)),bet=100,mult=1,busy=false,turbo=false,autoLeft=0,autoTimer=null,taps=0,grid=[];
const fmt=n=>Math.floor(n).toLocaleString('id-ID');
function save(){localStorage.setItem('me_balance',String(balance));$('balance').textContent=fmt(balance);$('bet').textContent=fmt(bet);$('totalBet').textContent=fmt(bet*mult)}
function randomTile(){return Math.floor(Math.random()*icons.length)}
function fresh(){return Array.from({length:4},()=>Array.from({length:5},randomTile))}
function render(winners=[]){let root=$('reels');root.innerHTML='';for(let c=0;c<5;c++){let reel=document.createElement('div');reel.className='reel';for(let r=0;r<4;r++){let cell=document.createElement('div'),idx=grid[r][c],data=icons[idx];cell.className='tile'+(winners.some(p=>p[0]===r&&p[1]===c)?' win':'');let span=document.createElement('span');span.className='symbol '+data[1];span.textContent=data[0];cell.appendChild(span);reel.appendChild(cell)}root.appendChild(reel)}}
function findWins(){let hit=[];for(let r=0;r<4;r++){let c=0;while(c<5){let start=c,s=grid[r][c];while(c+1<5&&grid[r][c+1]===s)c++;if(c-start+1>=3){for(let x=start;x<=c;x++)hit.push([r,x])}c++}}return hit}
function gravity(hits){let gone=new Set(hits.map(p=>p[0]+','+p[1]));for(let c=0;c<5;c++){let keep=[];for(let r=3;r>=0;r--)if(!gone.has(r+','+c))keep.push(grid[r][c]);while(keep.length<4)keep.push(randomTile());for(let r=3;r>=0;r--)grid[r][c]=keep[3-r]}}
function stopAuto(){if(autoTimer)clearTimeout(autoTimer);autoTimer=null;autoLeft=0;$('auto').textContent='AUTO 10';$('auto').classList.remove('active')}
function spin(){if(busy)return;if(balance<bet*mult){$('message').textContent='KOIN TIDAK CUKUP';stopAuto();return}busy=true;balance-=bet*mult;save();$('message').textContent='✦ SIMBOL BERPUTAR ✦';$('lastWin').textContent='0';$('cascade').textContent='CASCADE x1';grid=fresh();render();let delay=turbo?130:430;setTimeout(()=>cascade(1,0),delay)}
function cascade(level,total){let wins=findWins();$('cascade').textContent='CASCADE x'+level;if(!wins.length||level>5){finish(total);return}let reward=Math.round((wins.length/3)*bet*mult*level*0.65);total+=reward;$('message').textContent='✦ MENANG +'+fmt(reward)+' ✦';render(wins);setTimeout(()=>{gravity(wins);render();setTimeout(()=>cascade(level+1,total),turbo?100:320)},turbo?130:500)}
function finish(total){balance+=total;$('lastWin').textContent=fmt(total);$('message').textContent=total?'✦ TOTAL MENANG '+fmt(total)+' KOIN ✦':'BELUM MENANG — COBA LAGI';save();busy=false;if(autoLeft>0){autoLeft--;if(autoLeft===0)stopAuto();else autoTimer=setTimeout(spin,turbo?180:650)}}
$('spin').onclick=spin;$('minus').onclick=()=>{bet=Math.max(50,bet-50);save()};$('plus').onclick=()=>{bet=Math.min(5000,bet+50);save()};
document.querySelectorAll('.multi').forEach(b=>b.onclick=()=>{if(busy)return;mult=+b.dataset.m;document.querySelectorAll('.multi').forEach(x=>x.classList.toggle('active',x===b));save()});
$('turbo').onclick=()=>{turbo=!turbo;$('turbo').classList.toggle('active',turbo);$('turbo').textContent=turbo?'⚡ TURBO ON':'⚡ TURBO'};
$('auto').onclick=()=>{if(autoLeft){stopAuto();return}autoLeft=10;$('auto').textContent='STOP (10)';$('auto').classList.add('active');spin()};
$('brand').onclick=()=>{if(++taps>=5){$('admin').classList.toggle('show');taps=0}};
$('unlock').onclick=()=>{if($('pin').value==='112233'){$('adminControls').style.display='block';$('toast').textContent='Panel admin terbuka'}else $('toast').textContent='PIN salah'};
$('save').onclick=()=>{balance=Math.max(0,+$('newBalance').value||0);save();$('toast').textContent='Saldo disimpan'};
$('reset').onclick=()=>{stopAuto();balance=10000;bet=100;mult=1;save();$('lastWin').textContent='0';$('message').textContent='GAME DIRESET';document.querySelectorAll('.multi').forEach((x,i)=>x.classList.toggle('active',i===0))};
grid=fresh();render();save();
})();
</script></body></html>
